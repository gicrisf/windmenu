# ===============================================================================
# WindMenu Configuration
# ===============================================================================
# Controls the appearance and behavior of WindMenu, a Windows application
# launcher with a dmenu-like interface. Changes apply on daemon restart.
#
# --- Daemon ---
# Activation hotkey: any number of modifiers (WIN/CTRL/ALT/SHIFT) plus one other key.
# hotkey = ["CTRL", "ALT", "SPACE"]

# --- Search ---
# matching: how the typed query is compared against entries.
# matching = "fuzzy"       # fzf-style subsequence scoring, sorted by score (default)
# matching = "complete"    #   ...whole query matched as a substring
# matching = "keywords"    #   ...each whitespace-separated word must match
# case_sensitive = false   # match case exactly
# history = true           # most-used-first ordering

# --- Navigation ---
# Keys that move the selection while the menu is open (CTRL/SHIFT + one key).
# Up/Down always work; Left/Right also navigate when the caret is already at
# that end of the input.
# next = ["CTRL", "J"]     # move to next entry (down / right)
# prev = ["CTRL", "K"]     # move to previous entry (up / left)

# --- Window ---
# lines   = 12             # menu items shown at once (vertical mode only)
# width   = 1000           # window width in pixels
# center  = true           # center on screen
# padding = 8              # horizontal padding in pixels
# font    = "Consolas 20"  # font as "Family Size"
# prompt  = "Run :"        # text shown in the input box (default: none)

# Classic horizontal `dmenu -h` style (a single row across the top):
# horizontal = true
# width      = 0           # 0 = full monitor width
# center     = false       # disable auto-centering and pin to top-left

# --- Theme ---
# The built-in default is a Windows-blue scheme. Uncomment and set these six
# values to your liking (the example below reproduces a classic dmenu look):
# bg        = "#222222"   # Window background
# fg        = "#bbbbbb"   # Window text
# bg_select = "#005577"   # Selected item background
# fg_select = "#eeeeee"   # Selected item text
# bg_input  = "#222222"   # Input box background
# fg_input  = "#bbbbbb"   # Input box text
#
# Or define your own [themes.<name>] with the same six keys and select it with `theme`.

# --- Working Directory & Environment ---
# Directory that launched programs (both apps and commands) run from, and
# environment variables they inherit. Both are set once at startup; without
# `cwd`, programs inherit windmenu's own directory. A context or command `cwd`
# overrides the directory; a context or command `env` overrides individual
# variables (per key). Missing cwd paths are ignored with a warning, so windmenu
# always starts.
# cwd = "D:\\work"
# env = { NODE_ENV = "production" }

# --- Custom Commands ---
# Extra entries shown alongside discovered apps.
# [[commands]]
# name = "Windows Terminal"
# args = ["wt"]           # `args` runs a program
#
# [[commands]]
# name = "Dev server"
# args = ["npm", "start"]
# cwd  = "D:\\work\\my-project"   # run this command from a specific directory
# env  = { PORT = "3000" }        # extra environment variables for this command
#
# [[commands]]
# name = "Maximize Window"
# keys = ["WIN", "UP"]    # `keys` simulates a keyboard shortcut.

# --- Contexts ---
# A context groups commands that share a `cwd` and `env` (and can absorb an
# imported pack's commands). It's a shorthand — the commands appear as plain menu
# entries, not a submenu. Precedence: command > context > global, and `env`
# merges per key while `cwd` is replaced by the most specific one set.
#
# Windows note: CreateProcess can't run .bat/.ps1 directly — include the
# interpreter, e.g. ["cmd", "/c", "dev.bat"] or ["powershell", "-File", "dev.ps1"].
# [[contexts]]
# name = "Frontend"                          # docs only, unused at runtime
# cwd  = "D:\\work\\frontend"
# env  = { NODE_ENV = "development" }
# import = ["packs/commands/tooling.toml"]   # optional: a pack joins this context
#
#   [[contexts.commands]]
#   name = "Dev server"
#   args = ["cmd", "/c", "dev.bat"]          # scripts include their interpreter
#
#   [[contexts.commands]]
#   name = "API"
#   args = ["npm", "run", "api"]
#   cwd  = "D:\\work\\api"                   # most specific wins
#   env  = { PORT = "4000" }                 # merges over the context env
